<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family:Arial, sans-serif;
    background:#FFF9F2;
    color:#3A2830;
    line-height:1.7;
}

/* ===== TRANG ĐẦU ===== */

header{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:35px 20px;

    background:
        radial-gradient(
            circle at 20% 20%,
            #FFD95A 0%,
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 70%,
            #FF9BC4 0%,
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #FFF9F2,
            #FFF0F6
        );
}

.hero{
    max-width:850px;
}

.warning{
    color:#D92D75;
    font-size:15px;
    letter-spacing:5px;
    font-weight:bold;
    margin-bottom:22px;
}

h1{
    font-size:clamp(43px,10vw,85px);
    line-height:.95;
    text-transform:uppercase;
    font-weight:900;
    color:#3A2830;
}

h1 span{
    color:#E83E8C;
}

.subtitle{
    margin:28px auto;
    max-width:650px;
    color:#66565D;
    font-size:18px;
}

/* ===== BUTTON ===== */

.btn{
    display:inline-block;
    margin-top:20px;
    padding:14px 30px;

    background:#E83E8C;
    color:white;

    text-decoration:none;
    border-radius:30px;

    font-weight:bold;

    box-shadow:
        0 7px 20px rgba(232,62,140,.25);

    transition:.3s;
}

.btn:hover{
    background:#FFD447;
    color:#3A2830;
    transform:translateY(-3px);
}

/* ===== SECTION ===== */

section{
    padding:80px 20px;
    max-width:1100px;
    margin:auto;
}

.section-title{
    text-align:center;
    margin-bottom:48px;
}

.section-title h2{
    font-size:35px;
    text-transform:uppercase;
    color:#3A2830;
}

.section-title p{
    color:#766970;
    margin-top:10px;
}

.red{
    color:#E83E8C;
}

/* ===== CARD ===== */

.cards{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(230px,1fr));

    gap:22px;
}

.card{
    background:#FFFFFF;

    border:2px solid #F8D8E6;

    border-radius:20px;

    padding:30px;

    transition:.3s;

    box-shadow:
        0 8px 25px rgba(90,40,60,.08);
}

.card:hover{
    transform:translateY(-7px);

    border-color:#FF9BC4;

    box-shadow:
        0 12px 30px
        rgba(232,62,140,.15);
}

.icon{
    font-size:42px;
    margin-bottom:16px;
}

.card h3{
    color:#E83E8C;
    margin-bottom:10px;
}

.card p{
    color:#665960;
}

/* ===== BOX THÔNG TIN ===== */

.fact{
    margin-top:35px;

    background:
        linear-gradient(
            135deg,
            #FFF0A8,
            #FFE4EF
        );

    border-left:6px solid #FFD447;

    padding:35px;

    border-radius:16px;

    box-shadow:
        0 8px 25px
        rgba(100,60,70,.08);
}

.fact h3{
    color:#D92D75;
    font-size:25px;
    margin-bottom:10px;
}

/* ===== QUOTE ===== */

.quote{
    text-align:center;

    padding:100px 20px;

    background:
        linear-gradient(
            135deg,
            #FFE5F0,
            #FFF3B8
        );
}

.quote h2{
    font-size:
        clamp(30px,6vw,55px);

    max-width:850px;

    margin:auto;

    line-height:1.2;

    color:#3A2830;
}

.quote span{
    color:#E83E8C;
}

/* ===== TIMELINE ===== */

.timeline{
    border-left:4px solid #FF9BC4;

    padding-left:28px;
}

.step{
    margin-bottom:35px;
}

.step h3{
    color:#D99A00;
}

.step p{
    color:#665960;
}

/* ===== FOOTER ===== */

footer{
    text-align:center;

    padding:50px 20px;

    background:#FFF0F6;

    border-top:2px solid #F8D8E6;

    color:#806F76;
}

footer strong{
    color:#E83E8C;
}

/* ===== MOBILE ===== */

@media(max-width:600px){

    section{
        padding:60px 18px;
    }

    .card{
        padding:23px;
    }

    .fact{
        padding:25px;
    }

}
</style>
